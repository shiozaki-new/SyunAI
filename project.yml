name: SyunAI
options:
  bundleIdPrefix: com.syunai
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: M878XBQ25U
    CODE_SIGN_STYLE: Automatic

targets:
  SyunAI Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes:
          - "**/*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syunai.app.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/SyunAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        PRODUCT_NAME: "SyunAI WatchApp"
        PRODUCT_MODULE_NAME: SyunAIWatchApp
        GENERATE_INFOPLIST_FILE: false
        SDKROOT: watchos
    entitlements:
      path: WatchApp/SyunAI.entitlements

  SyunAI iPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPhoneApp
        excludes:
          - "**/*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syunai.app
        INFOPLIST_FILE: iPhoneApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iPhoneApp/SyunAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: "SyunAI"
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: iPhoneApp/SyunAI.entitlements
    dependencies:
      - target: SyunAI Watch App
        embed: watch
